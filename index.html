<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Назар Вітер: фотограф</title>
  <meta name="description" content="Назар Вітер: весільний, портретний і рекламний фотограф. Знімаю на середній формат.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.js" } }
  </script>
</head>
<body>
  <header class="nav">
    <a class="nav__logo" href="#top" data-i18n="nav.logo"></a>
    <nav class="nav__links">
      <a href="#about" data-i18n="nav.about"></a>
      <a href="#services" data-i18n="nav.services"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="nav__lang" role="group" aria-label="Language">
      <button type="button" data-lang="uk">UA</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <main id="top">
    <section class="scene">
      <div class="scene__pin">
        <h1 class="name" data-i18n="hero.name"></h1>
        <canvas class="stage" aria-hidden="true"></canvas>

        <div class="intro">
          <p data-i18n="hero.left"></p>
          <p data-i18n="hero.right"></p>
        </div>

        <div class="caption" aria-live="polite">
          <span class="caption__no"></span>
          <p class="caption__title"></p>
        </div>
      </div>
    </section>

    <!-- The film strip's photos as plain images, shown when WebGL or motion is off -->
    <ul class="frames"></ul>

    <section class="about" id="about">
      <figure class="about__pic develop">
        <img src="assets/img/P-13.webp" data-i18n-alt="alt.P-13" loading="lazy" width="896" height="1200">
      </figure>
      <div>
        <h2 data-i18n="about.title"></h2>
        <p data-i18n="about.p1"></p>
        <p data-i18n="about.p2"></p>
      </div>
    </section>

    <section class="break">
      <figure class="break__pic">
        <img src="assets/img/P-12.webp" data-i18n-alt="alt.P-12" loading="lazy" width="1376" height="768">
      </figure>
      <blockquote data-i18n="break.quote"></blockquote>
    </section>

    <section class="services" id="services">
      <h2 data-i18n="services.title"></h2>
      <ul class="services__list">
        <li data-preview="P-01"><strong data-i18n="s.1.name"></strong><span data-i18n="s.1.text"></span><b data-i18n="s.1.price"></b></li>
        <li data-preview="P-04"><strong data-i18n="s.2.name"></strong><span data-i18n="s.2.text"></span><b data-i18n="s.2.price"></b></li>
        <li data-preview="P-07"><strong data-i18n="s.3.name"></strong><span data-i18n="s.3.text"></span><b data-i18n="s.3.price"></b></li>
        <li data-preview="P-09"><strong data-i18n="s.4.name"></strong><span data-i18n="s.4.text"></span><b data-i18n="s.4.price"></b></li>
      </ul>
      <div class="preview" aria-hidden="true"><img alt=""></div>
    </section>

    <section class="contact" id="contact">
      <figure class="contact__pic">
        <img src="assets/img/P-15.webp" alt="" loading="lazy" width="1024" height="1024">
      </figure>
      <div>
        <h2 data-i18n="contact.title"></h2>
        <form class="form">
          <label><span data-i18n="form.name"></span><input name="name" type="text" autocomplete="name" required></label>
          <label><span data-i18n="form.contact"></span><input name="contact" type="text" required></label>
          <label><span data-i18n="form.date"></span><input name="date" type="text" data-i18n-placeholder="form.datePlaceholder"></label>
          <button type="submit" class="btn" data-i18n="form.submit"></button>
          <p class="form__status" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <footer class="foot">
    <span data-i18n="foot.demo"></span>
    <span>2026</span>
  </footer>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/ScrollTrigger.min.js"></script>
  <script src="vendor/lenis.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
